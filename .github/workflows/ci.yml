name: CI
on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: astral-sh/setup-uv@v5 # the sprite test compares against the game's Python renderer
      - run: npm ci
      - run: npm run check
      - run: npm test

  e2e:
    name: Browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: uv run --with playwright playwright install --with-deps chromium
      - run: npm run e2e
